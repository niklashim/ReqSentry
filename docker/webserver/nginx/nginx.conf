user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    absolute_redirect off;

    # Canonical ReqSentry development format; keep in sync with docs/access-logs.md.
    log_format reqsentry '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'host="$host" rt="$request_time" urt="$upstream_response_time" '
                        'peer="$realip_remote_addr" xff="$http_x_forwarded_for" '
                        'loc="$sent_http_location" rid="$request_id"';

    # Optional structured format for operators testing JSON ingestion.
    log_format reqsentry_json escape=json
        '{"timestamp":"$time_iso8601","client_ip":"$remote_addr",'
        '"peer_ip":"$realip_remote_addr","method":"$request_method",'
        '"target":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"host":"$host","user_agent":"$http_user_agent",'
        '"referrer":"$http_referer","request_time":"$request_time",'
        '"upstream_time":"$upstream_response_time",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"location":"$sent_http_location","request_id":"$request_id"}';

    include /etc/nginx/conf.d/*.conf;
}
