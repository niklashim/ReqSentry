server {
    listen 8082;
    server_name mycoolshop.se;
    root /usr/share/nginx/html/site2;
    index index.html;

    access_log /var/log/nginx/site2.access.log reqsentry;
    error_log /var/log/nginx/site2.error.log warn;

    location = /old-page { return 301 /new-page; }
    location = /temporary { return 302 /destination; }
    location = /new-page { default_type text/plain; return 200 "mycoolshop.se new page\n"; }
    location = /destination { default_type text/plain; return 200 "mycoolshop.se destination\n"; }
    location = /product { default_type text/plain; return 200 "mycoolshop.se product\n"; }
    location /users/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
