server {
    listen 8084;
    server_name blog.example;
    root /usr/share/nginx/html/site4;
    index index.html;

    access_log /var/log/nginx/site4.access.log reqsentry;
    error_log /var/log/nginx/site4.error.log warn;

    location = /old-page { return 301 /new-page; }
    location = /temporary { return 302 /destination; }
    location = /new-page { default_type text/plain; return 200 "blog.example new page\n"; }
    location = /destination { default_type text/plain; return 200 "blog.example destination\n"; }
    location = /product { default_type text/plain; return 200 "blog.example product\n"; }
    location /users/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
