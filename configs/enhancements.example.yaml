# Optional features; adapt paths/site IDs before running. No remote destination is enabled.
server:
  name: example-server
mode: monitor
trigger:
  mode: always
analysis:
  window: 30s
access_files:
  - path: /var/log/nginx/shop.access.jsonl
    site: shop
    type: nginx
    format: json
  - path: /var/log/app/api.access.log
    site: api
    format: logfmt
    profile: application
log_profiles:
  application:
    timestamp: rfc3339
    duration_unit: ms
    fields:
      request_time: elapsed_ms
  elastic:
    preset: ecs-v1
error_files:
  - path: /var/log/nginx/shop.error.log
    site: shop
    type: nginx
    timezone: Europe/Berlin
    minimum_severity: warning
  - path: /var/log/app/api.errors.jsonl
    site: api
    format: json
    minimum_severity: error
    # Opt in only if local stack traces are appropriate for your installation.
    retain_stack_trace: false
correlation:
  window: 60s
  max_events: 4096
database:
  path: /var/lib/reqsentry/reqsentry.db
  retention:
    max_age: 96h # Four days for all investigation history; raise or lower this ceiling.
    interval: 1m
    batch_size: 500
    error_samples_per_second: 20
    minimum_free_bytes: 1073741824
recovery:
  enabled: false # Opt-in event-time monitoring; see storage-output.md.
  interval: 1m
  max_bytes: 16777216
output:
  destinations:
    - name: teams-operations
      type: teams
      enabled: false
      webhook_env: REQSENTRY_TEAMS_WEBHOOK
      minimum_score: 80
      operational: true
      cooldown: 10m
    - name: sns-security
      type: sns
      enabled: false
      topic_arn: arn:aws:sns:eu-west-1:123456789012:reqsentry-alerts
      region: eu-west-1
      minimum_score: 80
      decisions: [SUSPICIOUS, WOULD_BLOCK]
      # Empty site matches server-wide incidents; omit sites to include every site.
      sites: [shop, api, ""]
